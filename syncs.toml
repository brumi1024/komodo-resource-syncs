[[procedure]]
name = "Backup Core Database"
description = "Triggers the Core database backup at the scheduled time."
tags = ["system", "sync"]
config.schedule = "Every day at 01:00"
config.failure_alert = true

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "BackupCoreDatabase", execution.params = {}, enabled = true }
]

##

[[procedure]]
name = "Deploy if changed"
tags = ["sync"]
config.failure_alert = true

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "RunSync", execution.params.sync = "komodo-app-stacks", enabled = true }
]

[[procedure.config.stage]]
name = "Stage 2"
enabled = true
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = "*", enabled = true }
]

##

[[procedure]]
name = "Global Auto Update"
description = "Pulls and auto updates Stacks and Deployments using 'poll_for_updates' or 'auto_update'."
tags = ["system", "sync"]
config.schedule = "Every day at 03:00"
config.failure_alert = true

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "GlobalAutoUpdate", execution.params = {}, enabled = true }
]

##

[[procedure]]
name = "Weekly Prune Images"
description = "Remove dangling/unused Docker images on all periphery hosts. Volumes and networks are NOT pruned."
tags = ["system", "sync"]
config.schedule = "Every Sunday at 04:00"
config.failure_alert = true

[[procedure.config.stage]]
name = "Prune all hosts"
enabled = true
executions = [
  { execution.type = "PruneImages", execution.params.server = "docker", enabled = true },
  { execution.type = "PruneImages", execution.params.server = "docker-seq", enabled = true },
  { execution.type = "PruneImages", execution.params.server = "sequoia-rpi-4", enabled = true },
  { execution.type = "PruneImages", execution.params.server = "homelab-vps", enabled = true },
]

##

[[resource_sync]]
name = "komodo-app-stacks"
tags = ["sync"]
[resource_sync.config]
linked_repo = "app-stacks"
webhook_enabled = true
resource_path = ["services", "common-vars.toml"]
include_variables = true

##

[[resource_sync]]
name = "komodo-op-sync"
tags = [
  "infrastructure",
  "1password-connect",
  "sync"
]
[resource_sync.config]
repo = "brumi1024/deploy-komodo-op"
git_account = "brumi1024"
resource_path = ["stack.toml"]

##
## Repo resource shared by all stacks in brumi1024/komodo-app-stacks.
## Lets stack.toml files reference this via `linked_repo = "app-stacks"`
## instead of repeating git_account/repo/branch/reclone in every stack.
##

[[repo]]
name = "app-stacks"
tags = ["sync", "infrastructure"]
[repo.config]
git_account = "brumi1024"
repo = "brumi1024/komodo-app-stacks"
branch = "main"

##
## Alerter for homelab notifications (Ntfy). All stacks have `send_alerts = true`
## by default, so enabling this alerter delivers stack state changes / failures
## to the configured Ntfy topic.
##
## 1Password setup (synced via komodo-op):
##   Item: Komodo
##   Section: ALERTER
##   Field: NTFY_URL   (e.g. https://ntfy.sh/your-private-topic)
##

[[alerter]]
name = "homelab-ntfy"
tags = ["sync", "infrastructure", "alerter"]
[alerter.config]
enabled = true
# Page-worthy alert types only. Auto-update / image-available events are
# audit-level — visible in the Komodo UI alert log, no need to push.
alert_types = [
  "ServerUnreachable",
  "ServerCpu",
  "ServerMem",
  "ServerDisk",
  "StackStateChange",
  "ProcedureFailed",
  "ActionFailed",
  "BuildFailed",
  "ResourceSyncPendingUpdates",
]

# Suppress alerts during the nightly Global Auto Update window — transient
# StackStateChange events during redeploys would otherwise page.
[[alerter.config.maintenance_windows]]
name = "Global Auto Update"
schedule_format = "English"
schedule = "Every day at 02:55"
duration_minutes = 20

[alerter.config.endpoint]
type = "Ntfy"
[alerter.config.endpoint.params]
url = "[[OP__KOMODO__ALERTER__NTFY_URL]]"
